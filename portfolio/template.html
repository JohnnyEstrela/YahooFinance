<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultor Financeiro</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mut:#6b7280;--bd:#e3e6eb;--acc:#2563eb;
--cheap:#15803d;--fair:#2563eb;--pricey:#d97706;--expensive:#dc2626;--na:#9ca3af}
:root[data-theme=dark]{--bg:#0f1218;--card:#181c24;--tx:#e6e8ec;--mut:#8b93a1;--bd:#262b36;--acc:#60a5fa;
--cheap:#4ade80;--fair:#60a5fa;--pricey:#fbbf24;--expensive:#f87171;--na:#6b7280}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--card:#181c24;--tx:#e6e8ec;--mut:#8b93a1;--bd:#262b36;--acc:#60a5fa;--cheap:#4ade80;--fair:#60a5fa;--pricey:#fbbf24;--expensive:#f87171;--na:#6b7280}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header,main{max-width:1200px;margin:auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button,select,input{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font:inherit}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px}.tk{font-weight:700;font-size:17px}
.nm{color:var(--mut);font-size:12px}.px{text-align:right;font-weight:600}
.up{color:var(--cheap)}.down{color:var(--expensive)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{border-top:3px solid var(--na);padding-top:6px}.m small{color:var(--mut);font-size:11px;display:block}
.m b{font-size:18px}.m i{font-style:normal;font-size:11px}
.cheap{--c:var(--cheap)}.fair{--c:var(--fair)}.pricey{--c:var(--pricey)}.expensive{--c:var(--expensive)}
.discount{--c:var(--cheap)}.premium{--c:var(--expensive)}.na{--c:var(--na)}
.m[class*=" "]{border-top-color:var(--c)}.m i{color:var(--c)}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:12px}
details summary{cursor:pointer;color:var(--acc);font-size:13px}
.news a{display:block;color:var(--tx);text-decoration:none;margin-top:6px;font-size:13px}
.news a:hover{color:var(--acc)}.news small{color:var(--mut)}
.err{color:var(--expensive);font-size:12px}
.legend{color:var(--mut);font-size:12px;margin:16px 0}
@media(max-width:480px){.metrics{grid-template-columns:1fr 1fr 1fr}.m b{font-size:16px}}
</style>
</head>
<body>
<header>
  <div><h1>📈 Consultor Financeiro</h1><div class="sub" id="gen"></div></div>
  <div class="bar">
    <button data-f="all" class="on">Todas</button>
    <button data-f="portfolio">Portefólio</button>
    <button data-f="watchlist">A seguir</button>
    <select id="sort"><option value="ticker">Ordenar: Ticker</option><option value="pe">P/E (12m)</option>
      <option value="fwd_pe">P/E (próx. 12m)</option><option value="peg">PEG</option><option value="value">Valor posição</option></select>
    <button id="theme" title="Tema">🌓</button>
  </div>
</header>
<main>
  <div class="summary" id="sum"></div>
  <div class="grid" id="grid"></div>
  <div class="legend" id="legend"></div>
</main>
<script>
const D=/*__DATA__*/null;
const L={cheap:"Barato",fair:"Justo",pricey:"Caro",expensive:"Muito caro",discount:"Desconto",premium:"Prémio",na:"n/d"};
const $=s=>document.querySelector(s);
const f=(v,d=1)=>v==null?"—":v.toLocaleString("pt-PT",{maximumFractionDigits:d,minimumFractionDigits:d});
const cap=v=>v==null?"—":v>=1e12?f(v/1e12,2)+" T":v>=1e9?f(v/1e9,1)+" B":f(v/1e6,0)+" M";
let filter="all";
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#theme").onclick=()=>{const r=document.documentElement,n=(r.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("theme",n)}catch(e){}};
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x===b));render()});
$("#sort").onchange=render;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function metric(label,v,cls){return `<div class="m ${cls}"><small>${label}</small><b>${f(v,1)}</b><br><i>${L[cls]}</i></div>`}
function card(c){
  const ch=c.change_pct;
  const news=(c.news||[]).map(n=>`<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}<br><small>${esc(n.publisher||"")}</small></a>`).join("")||"<small>Sem notícias.</small>";
  return `<article class="card"><div class="top"><div><div class="tk">${esc(c.ticker)} <span class="tag">${c.status==="portfolio"?"Portefólio":"A seguir"}</span></div>
  <div class="nm">${esc(c.name)}${c.sector?" · "+esc(c.sector):""}</div></div>
  <div class="px">${f(c.price,2)} ${esc(c.currency||"")}<div class="${ch>=0?"up":"down"}" style="font-size:12px">${ch==null?"":(ch>=0?"+":"")+f(ch,2)+"%"}</div></div></div>
  ${c.error?`<div class="err">Erro: ${esc(c.error)}</div>`:""}
  <div class="metrics">${metric("P/E (12m)",c.pe,c.pe_class||"na")}${metric("P/E (próx. 12m)",c.fwd_pe,c.fwd_pe_class||"na")}${metric("PEG",c.peg,c.peg_class||"na")}</div>
  <div class="facts"><span>Cap: ${cap(c.market_cap)}</span><span>Div: ${f(c.div_yield,2)}%</span>
  <span>Alvo: ${f(c.target,2)}</span><span>Analistas: ${esc(c.rating||"—")}</span>
  ${c.value!=null?`<span>Posição: ${f(c.value,0)}</span>`:""}${c.pl_pct!=null?`<span class="${c.pl_pct>=0?"up":"down"}">P/L: ${f(c.pl_pct,1)}%</span>`:""}</div>
  ${c.notes?`<div class="nm">📝 ${esc(c.notes)}</div>`:""}
  <details class="news"><summary>Notícias (${(c.news||[]).length})</summary>${news}</details></article>`}
function render(){
  const k=$("#sort").value;
  let r=D.companies.filter(c=>filter==="all"||c.status===filter);
  r.sort((a,b)=>k==="ticker"?a.ticker.localeCompare(b.ticker):(b[k]==null)-(a[k]==null)||(k==="value"?b[k]-a[k]:a[k]-b[k]));
  $("#grid").innerHTML=r.map(card).join("");
  const p=D.companies.filter(c=>c.status==="portfolio"),tot=p.reduce((s,c)=>s+(c.value||0),0);
  const cheap=D.companies.filter(c=>c.pe_class==="cheap"||c.peg_class==="discount").length;
  const exp=D.companies.filter(c=>c.pe_class==="expensive"||c.peg_class==="premium").length;
  $("#sum").innerHTML=[["Empresas",D.companies.length],["No portefólio",p.length],["Valor posições",f(tot,0)],["Oportunidades (barato/desconto)",cheap],["Atenção (muito caro/prémio)",exp]].map(([a,b])=>`<div class="stat"><b>${b}</b><span>${a}</span></div>`).join("");
}
const T=D.thresholds;
$("#gen").textContent="Atualizado: "+new Date(D.generated).toLocaleString("pt-PT");
$("#legend").innerHTML=`P/E: &lt;${T.pe.cheap} barato · ${T.pe.cheap}–${T.pe.fair} justo · ${T.pe.fair}–${T.pe.pricey} caro · ≥${T.pe.pricey} muito caro.<br>PEG: &lt;${T.peg.discount} desconto · ${T.peg.discount}–${T.peg.fair} justo · &gt;${T.peg.fair} prémio. Informação indicativa, não é aconselhamento financeiro.`;
render();
</script>
</body>
</html>

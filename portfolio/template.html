<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portefólio Diário</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#667085;--line:#e4e7ec;--accent:#3b6cf6;
--cheap:#12805c;--cheap-bg:#e0f5ec;--fair:#8a6a00;--fair-bg:#fff4cc;--pricey:#b54708;--pricey-bg:#ffead5;
--very_pricey:#b42318;--very_pricey-bg:#fee4e2;--expensive:#7a1d6b;--expensive-bg:#fbe3f6;--na:#667085;--na-bg:#eef0f3}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#181b22;--text:#e8eaf0;--muted:#98a2b3;--line:#2a2f3a;--accent:#7b9bff;
--cheap:#5fd8a6;--cheap-bg:#12332a;--fair:#f5cf5b;--fair-bg:#3a3010;--pricey:#ffb27a;--pricey-bg:#3d2411;
--very_pricey:#ff9a92;--very_pricey-bg:#411a17;--expensive:#f2a3e3;--expensive-bg:#3a1534;--na:#98a2b3;--na-bg:#242833}}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b22;--text:#e8eaf0;--muted:#98a2b3;--line:#2a2f3a;--accent:#7b9bff;
--cheap:#5fd8a6;--cheap-bg:#12332a;--fair:#f5cf5b;--fair-bg:#3a3010;--pricey:#ffb27a;--pricey-bg:#3d2411;
--very_pricey:#ff9a92;--very_pricey-bg:#411a17;--expensive:#f2a3e3;--expensive-bg:#3a1534;--na:#98a2b3;--na-bg:#242833}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:28px 0 10px}
.muted{color:var(--muted)}.sm{font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.controls button,.controls select,.controls input{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit}
.controls button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.controls input{flex:1;min-width:120px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px}
.tk{font-weight:700;font-size:17px}.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.price{text-align:right;font-weight:600}.up{color:var(--cheap)}.down{color:var(--very_pricey)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{border-radius:10px;padding:8px;text-align:center}
.m small{display:block;font-size:11px;opacity:.85;min-height:28px}
.m b{font-size:19px;display:block}.m span{font-size:12px;font-weight:600}
.m.cheap{background:var(--cheap-bg);color:var(--cheap)}.m.fair{background:var(--fair-bg);color:var(--fair)}
.m.pricey{background:var(--pricey-bg);color:var(--pricey)}.m.very_pricey{background:var(--very_pricey-bg);color:var(--very_pricey)}
.m.expensive{background:var(--expensive-bg);color:var(--expensive)}.m.na{background:var(--na-bg);color:var(--na)}
.advice{font-size:13.5px;border-left:3px solid var(--accent);padding-left:10px}
.extra{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
details summary{cursor:pointer;font-size:13px;color:var(--accent)}
ul.news{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.news a{color:var(--text);text-decoration:none;font-weight:500}ul.news a:hover{text-decoration:underline}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.chg{padding:6px 0;border-bottom:1px solid var(--line)}.chg:last-child{border:0}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.legend i{font-style:normal;border-radius:99px;padding:2px 10px}
.err{color:var(--very_pricey);font-size:12.5px}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:480px){.metrics{grid-template-columns:1fr}.m small{min-height:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>📈 Portefólio &amp; Watchlist</h1>
  <span class="muted sm" id="gen"></span>
</header>

<div class="controls">
  <button data-f="all" class="on">Todas</button>
  <button data-f="portfolio">Portefólio</button>
  <button data-f="watchlist">A seguir</button>
  <input id="q" type="search" placeholder="Pesquisar ticker / nome…">
  <select id="sort">
    <option value="ticker">Ordenar: Ticker</option>
    <option value="pe_ttm">P/E 12m passados ↑</option>
    <option value="pe_fwd">P/E próx. 12m ↑</option>
    <option value="peg">PEG ↑</option>
    <option value="change_pct">Variação dia ↓</option>
  </select>
  <button id="theme" title="Tema">◐</button>
</div>

<div class="kpis" id="kpis"></div>
<div class="legend" id="legend"></div>

<h2 id="chg-h" hidden>🔔 Mudanças desde a última execução</h2>
<div class="panel" id="chg" hidden></div>

<h2>Empresas</h2>
<div class="grid" id="grid"></div>

<h2>📰 Notícias de mercado</h2>
<div class="panel"><ul class="news" id="mnews"></ul></div>

<p class="muted sm" style="margin-top:28px">Dados: Yahoo Finance (podem ter atraso). As leituras são regras automáticas sobre os limiares definidos em <code>watchlist.json</code> — não constituem aconselhamento financeiro.</p>
</div>

<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const fmt = (v, d=2) => v==null ? "n/d" : v.toLocaleString("pt-PT",{maximumFractionDigits:d,minimumFractionDigits:d});
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filter="all";

$("#gen").textContent = "Atualizado: " + D.generated;
const th = D.thresholds;
const bandText = (b,i,arr) => `${b.label} ${i==0?"&lt;"+b.max:b.max==null?"&gt;"+arr[i-1].max:arr[i-1].max+"–"+b.max}`;
$("#legend").innerHTML =
  `<span class="muted">P/E:</span>` + th.pe.map((b,i,a)=>`<i class="m ${b.key}">${bandText(b,i,a)}</i>`).join("") +
  `<span class="muted" style="margin-left:10px">PEG:</span>` + th.peg.map((b,i,a)=>`<i class="m ${b.key}">${bandText(b,i,a)}</i>`).join("");

function newsHTML(list){ return list.map(n=>`<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a><br><span class="muted sm">${esc(n.publisher)} · ${esc(n.time)}</span></li>`).join("") || `<li class="muted sm">Sem notícias.</li>`; }

function metric(label, val, key, lab, d=1){
  return `<div class="m ${key}"><small>${label}</small><b>${fmt(val,d)}</b><span>${esc(lab)}</span></div>`;
}

function card(r){
  const ch = r.change_pct, chCls = ch==null?"":ch>=0?"up":"down";
  const pos = r.pnl_pct!=null ? `<span class="${r.pnl_pct>=0?"up":"down"}">P&amp;L ${fmt(r.pnl_pct,1)}% (${fmt(r.pnl_abs,0)} ${esc(r.currency)})</span>` : "";
  const val = r.position_value!=null ? `<span>Posição ${fmt(r.position_value,0)} ${esc(r.currency)}</span>` : "";
  const range = (r.week52_low&&r.week52_high) ? `<span>52s: ${fmt(r.week52_low,0)}–${fmt(r.week52_high,0)}</span>` : "";
  return `<article class="card">
    <div class="top"><div><span class="tk">${esc(r.ticker)}</span><span class="tag">${r.status=="portfolio"?"Portefólio":"A seguir"}</span><div class="muted sm">${esc(r.name)}${r.sector?" · "+esc(r.sector):""}</div></div>
    <div class="price">${r.price!=null?fmt(r.price)+" "+esc(r.currency):"n/d"}<div class="sm ${chCls}">${ch!=null?(ch>=0?"▲ ":"▼ ")+fmt(ch)+"%":""}</div></div></div>
    ${r.error?`<div class="err">Erro a obter dados: ${esc(r.error)}</div>`:""}
    <div class="metrics">
      ${metric("P/E<br>últimos 12m",r.pe_ttm,r.pe_ttm_key,r.pe_ttm_label)}
      ${metric("P/E<br>próx. 12m",r.pe_fwd,r.pe_fwd_key,r.pe_fwd_label)}
      ${metric("PEG<br>(+yield: "+fmt(r.pegy,2)+")",r.peg,r.peg_key,r.peg_label,2)}
    </div>
    ${r.advice?`<div class="advice">${esc(r.advice)}</div>`:""}
    <div class="extra">${val}${pos}${range}
      ${r.growth_pct!=null?`<span>Cresc. lucros ${fmt(r.growth_pct,1)}%</span>`:""}
      ${r.dividend_yield?`<span>Yield ${fmt(r.dividend_yield)}%</span>`:""}
      ${r.target?`<span>Alvo analistas ${fmt(r.target,0)}${r.recommendation?" ("+esc(r.recommendation)+")":""}</span>`:""}</div>
    ${r.notes?`<div class="muted sm">📝 ${esc(r.notes)}</div>`:""}
    <details><summary>Notícias (${r.news.length})</summary><ul class="news">${newsHTML(r.news)}</ul></details>
  </article>`;
}

function render(){
  const q = $("#q").value.trim().toLowerCase(), s = $("#sort").value;
  let rows = D.rows.filter(r => (filter=="all"||r.status==filter) && (!q || (r.ticker+" "+r.name).toLowerCase().includes(q)));
  rows.sort((a,b)=>{
    if(s=="ticker") return a.ticker.localeCompare(b.ticker);
    const av=a[s], bv=b[s];
    if(av==null||av<=0) return 1; if(bv==null||bv<=0) return -1;
    return s=="change_pct" ? bv-av : av-bv;
  });
  $("#grid").innerHTML = rows.map(card).join("") || `<div class="empty">Sem empresas. Adiciona com <code>python portfolio/report.py add TICKER</code>.</div>`;
  const cheapAll = rows.filter(r=>[r.pe_ttm_key,r.pe_fwd_key,r.peg_key].filter(k=>k!="na").every(k=>k=="cheap") && r.pe_ttm_key!="na").length;
  const pv = rows.reduce((t,r)=>t+(r.position_value||0),0);
  $("#kpis").innerHTML =
    `<div class="kpi"><span class="muted sm">Empresas</span><b>${rows.length}</b></div>`+
    `<div class="kpi"><span class="muted sm">Baratas nos 3 indicadores</span><b>${cheapAll}</b></div>`+
    `<div class="kpi"><span class="muted sm">PEG em Desconto</span><b>${rows.filter(r=>r.peg_key=="cheap").length}</b></div>`+
    `<div class="kpi"><span class="muted sm">PEG em Prémio</span><b>${rows.filter(r=>r.peg_key=="expensive").length}</b></div>`+
    (pv?`<div class="kpi"><span class="muted sm">Valor das posições*</span><b>${fmt(pv,0)}</b></div>`:"");
}
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x==b));render()});
$("#q").oninput=render; $("#sort").onchange=render;
$("#theme").onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue("--bg").trim()=="#0f1115";r.dataset.theme=dark?"light":"dark"};

if(D.changes.length){ $("#chg-h").hidden=$("#chg").hidden=false;
  $("#chg").innerHTML=D.changes.map(c=>`<div class="chg"><b>${esc(c.ticker)}</b> — ${esc(c.text)}</div>`).join(""); }
$("#mnews").innerHTML=newsHTML(D.market_news);
render();
</script>
</body>
</html>

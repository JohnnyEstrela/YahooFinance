<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Portefólio</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;
--good:#15803d;--goodbg:#dcfce7;--fair:#a16207;--fairbg:#fef9c3;--warn:#c2410c;--warnbg:#ffedd5;--bad:#b91c1c;--badbg:#fee2e2;--na:#6b7280;--nabg:#f3f4f6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#181b22;--text:#e8eaee;--muted:#9aa1ad;--line:#2a2f3a;--accent:#60a5fa;
--good:#4ade80;--goodbg:#14532d55;--fair:#facc15;--fairbg:#71490055;--warn:#fb923c;--warnbg:#7c2d1255;--bad:#f87171;--badbg:#7f1d1d55;--na:#9aa1ad;--nabg:#ffffff10}}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b22;--text:#e8eaee;--muted:#9aa1ad;--line:#2a2f3a;--accent:#60a5fa;--good:#4ade80;--goodbg:#14532d55;--fair:#facc15;--fairbg:#71490055;--warn:#fb923c;--warnbg:#7c2d1255;--bad:#f87171;--badbg:#7f1d1d55;--na:#9aa1ad;--nabg:#ffffff10}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.4rem;margin:0}.sub{color:var(--muted);font-size:.85rem}
button,select,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
button{cursor:pointer}button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.market{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.idx{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.idx b{display:block;font-size:.75rem;color:var(--muted)}
.up{color:var(--good)}.down{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tools input{flex:1 1 160px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--accent)}
.top{display:flex;justify-content:space-between;gap:8px}.sym{font-weight:700;font-size:1.1rem}.name{color:var(--muted);font-size:.8rem}
.price{text-align:right;font-weight:600}.tag{font-size:.65rem;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.p{color:var(--accent);border-color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.m{border-radius:10px;padding:7px 4px;text-align:center}.m small{display:block;font-size:.65rem;opacity:.85}.m b{font-size:1.05rem}.m em{display:block;font-size:.65rem;font-style:normal;font-weight:600}
.cheap,.discount{background:var(--goodbg);color:var(--good)}.fair{background:var(--fairbg);color:var(--fair)}
.pricey{background:var(--warnbg);color:var(--warn)}.expensive,.premium{background:var(--badbg);color:var(--bad)}.na{background:var(--nabg);color:var(--na)}
.range{height:5px;background:var(--line);border-radius:9px;margin:12px 0 2px;position:relative}.range i{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.rl{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted)}
.foot{margin-top:8px;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);width:min(680px,calc(100% - 24px));max-height:88vh;padding:18px}
dialog::backdrop{background:#0008}
.news a{display:block;color:var(--text);text-decoration:none;padding:9px 0;border-top:1px solid var(--line)}
.news a:hover b{color:var(--accent)}.news small{color:var(--muted);display:block}
h2{font-size:1.05rem;margin:22px 0 4px}
.err{color:var(--bad);font-size:.8rem}
@media(max-width:520px){.wrap{padding:12px}.metrics .m b{font-size:.95rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>📈 Meu Portefólio</h1><div class="sub" id="upd"></div></div>
  <button id="theme" title="Tema">🌓</button>
</header>
<div class="market" id="market"></div>
<div class="tools">
  <button data-f="all" class="on">Todas</button><button data-f="portfolio">Portefólio</button><button data-f="watchlist">Watchlist</button>
  <input id="q" type="search" placeholder="Pesquisar…">
  <select id="sort">
    <option value="symbol">Ordenar: Nome</option><option value="pe">P/E (trailing)</option><option value="forward_pe">P/E (forward)</option>
    <option value="peg">PEG</option><option value="change_pct">Variação dia</option><option value="value">Valor posição</option>
  </select>
</div>
<div class="legend" id="legend"></div>
<div class="grid" id="grid"></div>
<h2>📰 Notícias do mercado</h2>
<div class="news" id="mnews"></div>
<p class="sub">Dados Yahoo Finance, podem ter atraso. Informação apenas informativa, não constitui aconselhamento financeiro.</p>
</div>
<dialog id="dlg"></dialog>
<script src="data.js"></script>
<script>
const D=window.PORTFOLIO_DATA||{companies:[],market:[],market_news:[],thresholds:{pe:{cheap:15,fair:30,pricey:50},peg:{discount:1,fair:2}}};
const L={cheap:'Barato',fair:'Justo',pricey:'Caro',expensive:'Muito caro',discount:'Desconto',premium:'Prémio',na:'n/d'};
const T=D.thresholds;let filter='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=(v,d=2)=>v==null?'—':Number(v).toLocaleString('pt-PT',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null?'—':(v>=0?'+':'')+f(v)+'%';
const cls=v=>v==null?'':v>=0?'up':'down';
function ago(d){const m=(Date.now()-new Date(d))/6e4;return isNaN(m)?'':m<60?`há ${Math.round(m)} min`:m<1440?`há ${Math.round(m/60)} h`:`há ${Math.round(m/1440)} d`}
$('#upd').textContent='Atualizado: '+(D.updated?new Date(D.updated).toLocaleString('pt-PT'):'nunca – corre python portfolio/update.py');
$('#market').innerHTML=D.market.map(m=>`<div class="idx"><b>${esc(m.symbol)}</b>${f(m.price,0)} <span class="${cls(m.change_pct)}">${pct(m.change_pct)}</span></div>`).join('');
$('#legend').innerHTML=`<span><b>P/E</b> (trailing e forward): <span class="up">&lt;${T.pe.cheap} barato</span> · ${T.pe.cheap}–${T.pe.fair} justo · ${T.pe.fair}–${T.pe.pricey} caro · <span class="down">&gt;${T.pe.pricey} muito caro</span></span><span><b>PEG</b>: <span class="up">&lt;${T.peg.discount} desconto</span> · ${T.peg.discount}–${T.peg.fair} justo · <span class="down">&gt;${T.peg.fair} prémio</span></span>`;
const metric=(lbl,v,c,d=1)=>`<div class="m ${c}"><small>${lbl}</small><b>${f(v,d)}</b><em>${L[c]}</em></div>`;
function card(c){
  const lo=c.week52_low,hi=c.week52_high,pos=lo!=null&&hi>lo&&c.price!=null?Math.min(100,Math.max(0,(c.price-lo)/(hi-lo)*100)):null;
  return `<div class="card" data-s="${esc(c.symbol)}"><div class="top"><div><span class="sym">${esc(c.symbol)}</span><span class="tag ${c.status==='portfolio'?'p':''}">${c.status==='portfolio'?'Portefólio':'Watchlist'}</span><div class="name">${esc(c.name)}</div></div>
  <div class="price">${f(c.price)} ${esc(c.currency)}<div class="${cls(c.change_pct)}" style="font-size:.8rem">${pct(c.change_pct)}</div></div></div>
  ${c.error?`<div class="err">Erro: ${esc(c.error)}</div>`:''}
  <div class="metrics">${metric('P/E (12m)',c.pe,c.pe_class)}${metric('P/E (próx. 12m)',c.forward_pe,c.fpe_class)}${metric('PEG',c.peg??c.pegy,c.peg_class,2)}</div>
  ${pos!=null?`<div class="range"><i style="left:${pos}%"></i></div><div class="rl"><span>${f(lo)}</span><span>52 sem.</span><span>${f(hi)}</span></div>`:''}
  <div class="foot"><span>Div. ${f(c.dividend_yield)}%${c.pegy!=null?` · PEGY ${f(c.pegy)}`:''}</span>${c.pnl_pct!=null?`<span class="${cls(c.pnl_pct)}">P&L ${pct(c.pnl_pct)}</span>`:''}</div></div>`}
function render(){
  const q=$('#q').value.toLowerCase(),s=$('#sort').value;
  let r=D.companies.filter(c=>(filter==='all'||c.status===filter)&&(c.symbol+c.name).toLowerCase().includes(q));
  const key=c=>s==='value'?c.position_value:c[s];
  r.sort((a,b)=>s==='symbol'?a.symbol.localeCompare(b.symbol):s==='change_pct'||s==='value'?(key(b)??-1e9)-(key(a)??-1e9):(key(a)??1e9)-(key(b)??1e9));
  $('#grid').innerHTML=r.map(card).join('')||'<p class="sub">Sem empresas. Edita portfolio/watchlist.json e volta a correr update.py.</p>';
}
function news(list){return list.length?list.map(n=>`<a href="${esc(n.url)}" target="_blank" rel="noopener"><b>${esc(n.title)}</b><small>${esc(n.source)} · ${ago(n.date)}</small></a>`).join(''):'<p class="sub">Sem notícias.</p>'}
$('#mnews').innerHTML=news(D.market_news);
$('#grid').onclick=e=>{const el=e.target.closest('.card');if(!el)return;const c=D.companies.find(x=>x.symbol===el.dataset.s);
  $('#dlg').innerHTML=`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${esc(c.symbol)} · ${esc(c.name)}</h2><button onclick="dlg.close()">✕</button></div>
  <p class="sub">${esc(c.sector)} · Cap. ${c.market_cap?f(c.market_cap/1e9,1)+' mM':'—'} · Crescimento estimado ${f(c.growth,1)}% · Recomendação: ${esc(c.recommendation||'—')} · Alvo médio ${f(c.target)}</p>
  ${c.position_value?`<p>Posição: ${f(c.shares,0)} ações · ${f(c.position_value)} ${esc(c.currency)}</p>`:''}${c.notes?`<p>📝 ${esc(c.notes)}</p>`:''}
  <h2>Notícias</h2><div class="news">${news(c.news||[])}</div>`;dlg.showModal()};
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()});
$('#q').oninput=render;$('#sort').onchange=render;
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
render();
</script>
</body>
</html>

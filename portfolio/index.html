<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portefólio</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#6b7380;--bd:#e3e6ea;--g:#1a7f4b;--y:#b7791f;--o:#c05621;--r:#c53030}
@media(prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--fg:#e8eaed;--mut:#8b94a1;--bd:#2a3039;--g:#4ade80;--y:#facc15;--o:#fb923c;--r:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;padding:16px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 14px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--fg);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.top{display:flex;justify-content:space-between;gap:8px}.tk{font-weight:700;font-size:17px}.nm{color:var(--mut);font-size:12px}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.m div{background:var(--bg);border-radius:8px;padding:8px}
.m small{display:block;color:var(--mut);font-size:11px}.m b{font-size:16px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.Barato,.Desconto{color:var(--g)}.Justo{color:var(--y)}.Caro{color:var(--o)}.Muito,.Premium{color:var(--r)}.nd{color:var(--mut)}
ul{margin:8px 0 0;padding-left:18px;font-size:13px}a{color:inherit}.bar{font-size:12px;color:var(--mut)}.err{color:var(--r);font-size:12px}
</style></head><body>
<h1>📈 O meu portefólio</h1><div class="sub" id="up"></div>
<div class="tabs" id="tabs"></div><div class="grid" id="g"></div>
<script>
const D={"updated": "2026-10-14 14:02 UTC", "thresholds": {"pe": {"cheap": 15, "fair": 30, "pricey": 50}, "peg": {"discount": 1, "fair": 2}}, "companies": [{"name": "AAPL (demo)", "price": 200.0, "currency": "USD", "pe": 32.1, "fpe": 27.4, "peg": 2.3, "pegy": 2.1, "yield": 0.5, "sector": "Demo", "news": [{"title": "Notícia de exemplo", "url": "#", "publisher": "Demo", "date": null}], "ticker": "AAPL", "status": "owned", "notes": "Exemplo - substitui pelas tuas empresas", "shares": 10, "avg_cost": 150.0, "value": 2000.0, "pnl_pct": 33.33333333333333, "pe_label": "Caro", "fpe_label": "Justo", "peg_label": "Premium"}, {"name": "MSFT (demo)", "price": 200.0, "currency": "USD", "pe": 32.1, "fpe": 27.4, "peg": 2.3, "pegy": 2.1, "yield": 0.5, "sector": "Demo", "news": [{"title": "Notícia de exemplo", "url": "#", "publisher": "Demo", "date": null}], "ticker": "MSFT", "status": "watching", "notes": "Exemplo", "pe_label": "Caro", "fpe_label": "Justo", "peg_label": "Premium"}]};let f="all";
const cls=l=>l==="Muito caro"?"Muito":l==="n/d"?"nd":l;
const n=(v,d=2)=>v==null?"—":v.toFixed(d);
function render(){
 document.getElementById("up").textContent="Atualizado: "+D.updated+" · P/E: <"+D.thresholds.pe.cheap+" barato, <"+D.thresholds.pe.fair+" justo, <"+D.thresholds.pe.pricey+" caro · PEG: <"+D.thresholds.peg.discount+" desconto, ≤"+D.thresholds.peg.fair+" justo";
 document.getElementById("tabs").innerHTML=[["all","Todas"],["owned","Portefólio"],["watching","A seguir"]].map(([k,l])=>`<button class="${f==k?"on":""}" onclick="f='${k}';render()">${l}</button>`).join("");
 const tag=l=>`<span class="tag ${cls(l)}">${l}</span>`;
 document.getElementById("g").innerHTML=D.companies.filter(c=>f=="all"||c.status==f).map(c=>`
 <div class="card"><div class="top"><div><div class="tk">${c.ticker}</div><div class="nm">${c.name||""}${c.sector?" · "+c.sector:""}</div></div>
 <div style="text-align:right"><b>${n(c.price)} ${c.currency||""}</b>${c.pnl_pct!=null?`<div class="bar">${c.pnl_pct>=0?"+":""}${n(c.pnl_pct,1)}% vs custo</div>`:""}</div></div>
 ${c.error?`<div class="err">Erro: ${c.error}</div>`:""}
 <div class="m"><div><small>P/E (12m)</small><b>${n(c.pe,1)}</b><br>${tag(c.pe_label)}</div>
 <div><small>P/E (próx. 12m)</small><b>${n(c.fpe,1)}</b><br>${tag(c.fpe_label)}</div>
 <div><small>PEG</small><b>${n(c.peg)}</b><br>${tag(c.peg_label)}</div></div>
 <div class="bar">Yield ${n(c.yield)}% · PEGY ${n(c.pegy)}${c.value?` · Posição ${n(c.value,0)}`:""}</div>
 ${c.notes?`<div class="bar">📝 ${c.notes}</div>`:""}
 <ul>${(c.news||[]).map(x=>`<li><a href="${x.url||"#"}" target="_blank" rel="noopener">${x.title}</a> <span class="bar">${x.publisher||""}</span></li>`).join("")}</ul></div>`).join("");
}
render();
</script></body></html>

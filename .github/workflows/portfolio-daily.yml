name: Portfolio daily refresh

on:
  schedule:
    - cron: "30 7 * * 1-5" # dias úteis, 07:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "yfinance>=1.6.0,<2"
      - run: python portfolio/refresh.py
      - name: Commit changes
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "chore: daily portfolio refresh"
          git push

name: Portfolio daily update

on:
  schedule:
    - cron: "30 6 * * 1-5" # dias úteis, 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python portfolio/update.py
      - name: Commit results
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add -f portfolio/data/latest.json portfolio/docs/index.html
          git diff --cached --quiet || git commit -m "chore: daily portfolio update" && git push

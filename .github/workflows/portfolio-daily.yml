name: portfolio-daily
on:
  schedule: [{cron: "30 21 * * 1-5"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance && python portfolio/update.py
      - run: |
          git config user.name "portfolio-bot"; git config user.email "bot@users.noreply.github.com"
          git add portfolio/data.js portfolio/data.json
          git diff --staged --quiet || (git commit -m "chore: atualizar dados do portefólio" && git push)

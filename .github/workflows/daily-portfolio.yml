name: Daily portfolio report

on:
  schedule:
    - cron: "30 21 * * 1-5"   # dias úteis, depois do fecho de NY
  workflow_dispatch:
  push:
    paths: ["portfolio/watchlist.json"]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python portfolio/report.py run
      - name: Commit dashboard
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add portfolio/dashboard.html portfolio/history
          git diff --cached --quiet || git commit -m "chore: daily portfolio report" && git push

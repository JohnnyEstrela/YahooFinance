<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultor Financeiro</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#161a22;--mut:#6b7280;--bd:#e3e6ec;--ac:#2f5bea;
--g:#12804a;--gb:#dff5e8;--y:#8a6100;--yb:#fdf1cf;--o:#a24a00;--ob:#ffe4cf;--r:#b3261e;--rb:#fde0de;--n:#6b7280;--nb:#eceef2}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e8ebf2;--mut:#98a1b3;--bd:#272d3a;--ac:#7c9bff;
--g:#5fd593;--gb:#12301f;--y:#f0c24d;--yb:#3a2f0e;--o:#ffa862;--ob:#3d2411;--r:#ff8f86;--rb:#3d1815;--nb:#232834}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline}
h1{font-size:22px;margin:0}.mut{color:var(--mut);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.bar button,.bar select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}
.bar button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-bottom:16px}
.legend div{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.top{display:flex;justify-content:space-between;gap:8px}
.tk{font-weight:700;font-size:18px}.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--nb);color:var(--mut)}
.tag.p{background:var(--gb);color:var(--g)}
.price{text-align:right;font-weight:600}.up{color:var(--g)}.dn{color:var(--r)}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.m div{border-radius:10px;padding:8px;text-align:center}.m b{display:block;font-size:19px}.m span{font-size:11px;display:block}
.cheap,.disc{background:var(--gb);color:var(--g)}.fair{background:var(--yb);color:var(--y)}
.pricey{background:var(--ob);color:var(--o)}.exp,.prem{background:var(--rb);color:var(--r)}.nd{background:var(--nb);color:var(--n)}
.news{list-style:none;padding:0;margin:0;font-size:13px}.news li{padding:6px 0;border-top:1px solid var(--bd)}
.news a{color:var(--tx);text-decoration:none}.news a:hover{color:var(--ac)}
</style></head><body><main>
<header><h1>📈 Consultor Financeiro</h1><span class="mut" id="upd"></span></header>
<div class="bar" id="bar"></div>
<div class="legend">
<div><b>P/E (últimos 12m)</b> e <b>P/E (próx. 12m)</b><br>&lt;15 Barato · ~20 Justo · ~40 Caro · &gt;50 Muito caro</div>
<div><b>PEG</b> (P/E ajustado ao crescimento)<br>&lt;1 Desconto · 1–2 Justo · &gt;2 Prémio</div>
</div>
<div class="grid" id="grid"></div></main>
<script src="data.js"></script>
<script>
const pe2=v=>v==null?['nd','n/d']:v<15?['cheap','Barato']:v<=20?['fair','Justo']:v<40?['fair','Justo+']:v<=50?['pricey','Caro']:['exp','Muito caro'];
const peg=v=>v==null?['nd','n/d']:v<1?['disc','Desconto']:v<=2?['fair','Justo']:['prem','Prémio'];
let list='all',sort='ticker';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function met(label,v,f){const[c,t]=f(v);return`<div class="${c}"><span>${label}</span><b>${v==null?'–':v.toFixed(1)}</b><span>${t}</span></div>`}
function render(){
 const D=window.DATA;document.getElementById('upd').textContent='Atualizado: '+D.updated.replace('T',' ').slice(0,16)+' UTC';
 const labs={all:'Todas',portfolio:'Portefólio',watchlist:'A seguir'};
 document.getElementById('bar').innerHTML=Object.entries(labs).map(([k,l])=>`<button class="${k==list?'on':''}" data-l="${k}">${l}</button>`).join('')+
 `<select id="s"><option value="ticker">Ordenar: Nome</option><option value="pe_ttm">P/E 12m</option><option value="pe_fwd">P/E fwd</option><option value="peg">PEG</option></select>`;
 const s=document.getElementById('s');s.value=sort;s.onchange=()=>{sort=s.value;render()};
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{list=b.dataset.l;render()});
 const items=D.items.filter(i=>list=='all'||i.list==list).sort((a,b)=>sort=='ticker'?a.ticker.localeCompare(b.ticker):(a[sort]??1e9)-(b[sort]??1e9));
 document.getElementById('grid').innerHTML=items.map(i=>{
  const ch=i.change_pct;
  return`<article class="card"><div class="top"><div><span class="tk">${esc(i.ticker)}</span> <span class="tag ${i.list=='portfolio'?'p':''}">${i.list=='portfolio'?'Portefólio':'A seguir'}</span><div class="mut">${esc(i.name)}</div></div>
  <div class="price">${i.price??'–'} ${esc(i.currency||'')}<div class="${ch>=0?'up':'dn'}">${ch==null?'':(ch>=0?'+':'')+ch.toFixed(2)+'%'}</div></div></div>
  <div class="m">${met('P/E 12m',i.pe_ttm,pe2)}${met('P/E próx. 12m',i.pe_fwd,pe2)}${met('PEG',i.peg,peg)}</div>
  <ul class="news">${(i.news||[]).slice(0,3).map(n=>`<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="mut">${esc(n.source)} · ${esc(n.date)}</div></li>`).join('')||'<li class="mut">Sem notícias</li>'}</ul></article>`}).join('');
}
render();
</script></body></html>
